name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api]"
      - name: Lint
        run: ruff check src scripts api tests
      - name: Unit tests
        # Integration tests skip themselves when the licensed OS data is absent,
        # which it always is in CI - the GeoPackages are not redistributable.
        run: pytest -q
      - name: API smoke test
        run: |
          python -c "
          from fastapi.testclient import TestClient
          import sys; sys.path.insert(0,'.')
          from api.main import app
          r = TestClient(app).get('/health')
          assert r.status_code == 200, r.text
          print('health:', r.json())
          "

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: sidewalk-width:ci }
