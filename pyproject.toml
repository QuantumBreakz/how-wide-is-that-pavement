[project]
name = "sidewalk-width"
version = "1.0.0"
description = "Multi-source geospatial pavement-width measurement with computer-vision validation"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.8",
  "pyproj>=3.6",
  "networkx>=3.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter", "nbformat", "nbconvert", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests bootstrap sys.path before importing the package, so imports
# legitimately follow executable statements.
"scripts/*" = ["E402", "E702"]
"tests/*" = ["E402"]
"api/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
